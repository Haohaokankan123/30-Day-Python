<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — 30 Days of Python</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: var(--bg-1, #0b0f17);
        }
        .reset-card {
            width: min(420px, 92vw);
            padding: 32px 28px;
            background: var(--bg-2, #131a26);
            border: 1px solid var(--border, rgba(255,255,255,0.08));
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            color: var(--text-1, #e5e7eb);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .reset-card h1 { margin: 0 0 6px; font-size: 22px; }
        .reset-card p.sub { margin: 0 0 18px; font-size: 14px; color: var(--text-3, #94a3b8); }
        .reset-card .auth-input { display: block; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        .reset-card .auth-submit-btn { width: 100%; }
        .reset-msg { display: none; padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
        .reset-msg.err { display: block; background: rgba(220,38,38,0.12); border: 1px solid rgba(220,38,38,0.3); color: #fca5a5; }
        .reset-msg.ok  { display: block; background: rgba(62,207,142,0.12); border: 1px solid rgba(62,207,142,0.3); color: #86efac; }
        .reset-back { display: block; margin-top: 14px; text-align: center; font-size: 13px; color: var(--accent, #60a5fa); text-decoration: none; }
        .reset-back:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="reset-card">
        <h1>Set a new password</h1>
        <p class="sub">Enter your new password below.</p>
        <div id="resetMsg" class="reset-msg"></div>
        <div id="resetForm">
            <input id="resetPw" class="auth-input" type="password" placeholder="New password (min 8 characters)" autocomplete="new-password" />
            <input id="resetPwConfirm" class="auth-input" type="password" placeholder="Confirm new password" autocomplete="new-password" />
            <button id="resetBtn" class="auth-submit-btn">Update password</button>
        </div>
        <a href="/" class="reset-back">← Back to home</a>
    </div>

    <script>
        const SUPABASE_URL = "https://dwuqcrqiuwtudkujlxzz.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR3dXFjcnFpdXd0dWRrdWpseHp6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNTQ2MDYsImV4cCI6MjA5NDYzMDYwNn0._iZ1aVmKhdyp2ImfluajnZabhikqQ5mCgsmLmWPxWuo";
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const msgEl = document.getElementById("resetMsg");
        const formEl = document.getElementById("resetForm");
        const btn = document.getElementById("resetBtn");
        const pwEl = document.getElementById("resetPw");
        const pwConfirmEl = document.getElementById("resetPwConfirm");

        function showMsg(text, kind) {
            msgEl.className = "reset-msg " + (kind === "ok" ? "ok" : "err");
            msgEl.textContent = text;
        }

        let recoveryReady = false;

        // Supabase auto-detects the recovery token in the URL hash and fires this event.
        // We only allow updating the password while a recovery session is active.
        sb.auth.onAuthStateChange((event, session) => {
            if (event === "PASSWORD_RECOVERY" || (event === "SIGNED_IN" && session?.user)) {
                recoveryReady = true;
            }
        });

        // If the page is opened without any recovery context, block the form.
        // Give Supabase a moment to parse the URL hash before deciding.
        setTimeout(async () => {
            const { data } = await sb.auth.getSession();
            if (!recoveryReady && !data.session) {
                showMsg("This reset link is invalid or expired. Request a new one from the home page.", "err");
                formEl.style.display = "none";
            }
        }, 600);

        async function update() {
            msgEl.style.display = "none";
            const pw = pwEl.value.trim();
            const pw2 = pwConfirmEl.value.trim();
            if (!pw || !pw2) { showMsg("Please fill in both fields.", "err"); return; }
            if (pw.length < 8) { showMsg("Password must be at least 8 characters.", "err"); return; }
            if (pw !== pw2) { showMsg("Passwords don't match.", "err"); return; }

            btn.disabled = true;
            btn.textContent = "Updating…";
            try {
                const { error } = await sb.auth.updateUser({ password: pw });
                if (error) { showMsg(error.message, "err"); return; }
                showMsg("Password updated! Redirecting…", "ok");
                setTimeout(() => { window.location.href = "/"; }, 1200);
            } catch (e) {
                showMsg(e.message || "Something went wrong.", "err");
            } finally {
                btn.disabled = false;
                btn.textContent = "Update password";
            }
        }

        btn.addEventListener("click", update);
        pwConfirmEl.addEventListener("keydown", e => { if (e.key === "Enter") update(); });
    </script>
</body>
</html>
